<!-- Lucide Icons CDN -->
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<script>
/* ── Lucide: render icons inside the navbar ── */
(function tryLucide() {
  if (typeof lucide !== 'undefined') {
    lucide.createIcons();
  } else {
    /* CDN not ready yet — wait a tick */
    setTimeout(tryLucide, 50);
  }
})();

/* ── Navbar: Live cart + wishlist badge updater ── */
(function () {
  function getCount(key) {
    try {
      var data = JSON.parse(localStorage.getItem(key) || '[]');
      if (Array.isArray(data)) {
        /* cart stores [{qty:n,...}] — sum quantities */
        if (key === 'velour_cart') {
          return data.reduce(function (sum, item) { return sum + (item.qty || item.quantity || 1); }, 0);
        }
        return data.length;
      }
    } catch (e) {}
    return 0;
  }

  function setBadge(ids, count) {
    ids.forEach(function (id) {
      var el = document.getElementById(id);
      if (!el) return;
      if (count > 0) {
        el.textContent = count > 99 ? '99+' : count;
        el.style.opacity = '1';
        el.style.transform = 'translate(50%, -50%) scale(1)';
      } else {
        el.style.opacity = '0';
        el.style.transform = 'translate(50%, -50%) scale(0)';
      }
    });
  }

  function updateBadges() {
    setBadge(['nav-cart-count', 'mobile-cart-count'], getCount('velour_cart'));
    setBadge(['nav-wishlist-count', 'mobile-wishlist-count'], getCount('velour_wishlist'));
  }

  /* Run on load and whenever localStorage changes (cross-tab) */
  updateBadges();
  window.addEventListener('storage', updateBadges);

  /* Also listen for a custom event fired by cart/wishlist JS on the same tab */
  window.addEventListener('velour:cart:updated', updateBadges);
  window.addEventListener('velour:wishlist:updated', updateBadges);
})();
</script>
