<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Confirmed — Velour Hair Studio</title>
  <meta name="description" content="Your Velour Hair Studio order has been confirmed. Thank you for shopping with us!" />
  <meta name="robots" content="noindex" />
  <meta name="author" content="Velour Hair Studio" />
  <meta name="theme-color" content="#6B3F5E" />

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg" />
  <link rel="icon" type="image/x-icon" href="/assets/icons/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/css/output.css" />
  <link rel="stylesheet" href="/css/custom.css" />
  <link rel="stylesheet" href="/ecommerce/css/ecommerce-variables.css" />
  <link rel="stylesheet" href="/ecommerce/css/order-success.css" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;1,300&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body class="min-h-screen bg-cream dark:bg-dark-bg text-ink dark:text-cream antialiased font-outfit">

  <main>

    <!-- ── Loading Skeleton ─────────────────────────────────── -->
    <div class="order-success-page" id="order-skeleton" aria-hidden="true">
      <div style="text-align:center;max-width:500px;margin:0 auto;">
        <div class="ec-skeleton" style="height:80px;width:80px;border-radius:50%;margin:0 auto 24px;"></div>
        <div class="ec-skeleton" style="height:32px;width:300px;border-radius:8px;margin:0 auto 12px;"></div>
        <div class="ec-skeleton" style="height:16px;width:240px;border-radius:6px;margin:0 auto 40px;"></div>
        <div class="ec-skeleton" style="height:200px;border-radius:20px;"></div>
      </div>
    </div>

    <!-- ── Success Content ──────────────────────────────────── -->
    <div class="order-success-page" id="order-content" style="display:none;">

      <!-- Success Animation -->
      <div class="order-success-hero">
        <div class="order-success-check">
          <svg viewBox="0 0 52 52" fill="none">
            <circle class="order-success-check__circle" cx="26" cy="26" r="24" stroke="currentColor" stroke-width="2"/>
            <polyline class="order-success-check__tick" points="16 26 23 33 36 20" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
        </div>
        <h1 class="order-success-hero__title">Order Confirmed!</h1>
        <p class="order-success-hero__subtitle" id="order-thank-you">Thank you for your purchase.</p>
      </div>

      <!-- Order Details Card -->
      <div class="order-details-card" id="order-details-card">
        <div class="order-details-card__header">
          <div>
            <p class="order-details-card__label">Order Reference</p>
            <p class="order-details-card__ref" id="order-ref">—</p>
          </div>
          <div style="text-align:right;">
            <p class="order-details-card__label">Date</p>
            <p class="order-details-card__date" id="order-date">—</p>
          </div>
        </div>

        <!-- Items -->
        <div class="order-details-card__section">
          <p class="order-details-card__section-title">Items Ordered</p>
          <div class="order-items-list" id="order-items-list"></div>
        </div>

        <!-- Delivery -->
        <div class="order-details-card__section">
          <p class="order-details-card__section-title">Delivery To</p>
          <p class="order-details-card__text" id="order-delivery-address">—</p>
        </div>

        <!-- Totals -->
        <div class="order-details-card__totals">
          <div class="order-details-card__row">
            <span>Subtotal</span>
            <span id="order-subtotal">₦0</span>
          </div>
          <div class="order-details-card__row">
            <span>Shipping</span>
            <span id="order-shipping">₦0</span>
          </div>
          <div class="order-details-card__row order-details-card__row--total">
            <span>Total Paid</span>
            <span id="order-total">₦0</span>
          </div>
        </div>

        <!-- Customer email -->
        <div class="order-details-card__footer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <span>A confirmation email has been sent to <strong id="order-email">—</strong></span>
        </div>
      </div>

      <!-- Actions -->
      <div class="order-success-actions">
        <a href="/ecommerce/pages/shop.html" class="ec-btn ec-btn--primary">Continue Shopping</a>
        <a href="/index.html" class="ec-btn ec-btn--outline">Return Home</a>
      </div>

    </div>

  </main>

  <!-- Footer -->
  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script src="/ecommerce/js/products-data.js"></script>
  <script src="/ecommerce/js/cart.js"></script>
  <script src="/ecommerce/js/wishlist.js"></script>
  <script src="/js/main.js" defer></script>
  <script src="/ecommerce/js/order-success.js" defer></script>
</body>

</html>
