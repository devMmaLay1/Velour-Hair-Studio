<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phase 1 — Cart & Data Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;1,300&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/ecommerce-variables.css" />
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: #0D0A0E;
      color: #F5EFE6;
      padding: 40px 24px;
      max-width: 1000px;
      margin: 0 auto;
    }
    h1 { font-family: 'Fraunces', serif; font-weight: 300; font-size: 36px; margin-bottom: 8px; }
    h1 em { color: #C9A96E; }
    .subtitle { color: rgba(245,239,230,0.5); font-size: 14px; margin-bottom: 40px; }
    h2 { font-family: 'Fraunces', serif; font-weight: 400; font-size: 20px; margin: 32px 0 16px; color: #C9A96E; }
    .test-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }
    .test-card {
      background: #1A1220;
      border: 0.5px solid rgba(201,169,110,0.12);
      border-radius: 16px;
      overflow: hidden;
    }
    .test-card__img {
      height: 160px;
      background: linear-gradient(135deg, #1A1220 0%, #2a1832 100%);
      display: flex; align-items: center; justify-content: center;
      color: rgba(201,169,110,0.3); font-size: 32px;
    }
    .test-card__img img { width: 100%; height: 100%; object-fit: cover; }
    .test-card__body { padding: 14px; }
    .test-card__cat { font-size: 9px; text-transform: uppercase; letter-spacing: 2px; color: #C9A96E; font-weight: 600; margin-bottom: 4px; }
    .test-card__name { font-family: 'Fraunces', serif; font-size: 15px; margin-bottom: 6px; }
    .test-card__price { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
    .test-card__price .old { text-decoration: line-through; color: rgba(245,239,230,0.35); font-size: 12px; margin-left: 6px; }
    .test-card__badge { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .test-card__badge--sale { background: #c94444; color: #fff; }
    .test-card__badge--new { background: #C9A96E; color: #1a0f17; }
    .test-card__badge--best { background: #6B3F5E; color: #F5EFE6; }
    .test-card__badge--value { background: #2f7d57; color: #fff; }
    .test-add-btn {
      background: linear-gradient(135deg, #C9A96E, #d4b87a);
      color: #1a0f17;
      border: none;
      border-radius: 999px;
      padding: 8px 18px;
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .test-add-btn:hover { transform: translateY(-1px); }
    .cart-panel {
      background: #1A1220;
      border: 0.5px solid rgba(201,169,110,0.12);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .cart-panel__empty { color: rgba(245,239,230,0.35); text-align: center; padding: 24px; }
    .cart-item-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0;
      border-bottom: 0.5px solid rgba(245,239,230,0.06);
    }
    .cart-item-row:last-child { border-bottom: none; }
    .cart-item-row__name { font-size: 14px; }
    .cart-item-row__variant { font-size: 11px; color: rgba(245,239,230,0.4); }
    .cart-item-row__meta { text-align: right; }
    .cart-item-row__qty { font-size: 12px; color: rgba(245,239,230,0.5); }
    .cart-item-row__price { font-size: 14px; font-weight: 600; }
    .cart-item-row__remove {
      background: none; border: none; color: rgba(245,239,230,0.3); cursor: pointer; font-size: 18px; margin-left: 12px;
    }
    .cart-item-row__remove:hover { color: #c94444; }
    .cart-total {
      display: flex; justify-content: space-between; padding-top: 12px; margin-top: 8px;
      border-top: 0.5px solid rgba(245,239,230,0.15);
    }
    .cart-total__label { font-size: 15px; font-weight: 600; }
    .cart-total__value { font-size: 18px; font-weight: 700; color: #C9A96E; }
    .clear-btn {
      background: transparent; border: 1px solid rgba(245,239,230,0.15); color: rgba(245,239,230,0.6);
      border-radius: 999px; padding: 8px 20px; font-family: 'Outfit', sans-serif; font-size: 11px;
      text-transform: uppercase; letter-spacing: 1.5px; cursor: pointer; margin-top: 12px;
    }
    .clear-btn:hover { border-color: #c94444; color: #c94444; }
    .stats { display: flex; gap: 24px; margin-bottom: 24px; }
    .stat { text-align: center; }
    .stat__num { font-family: 'Fraunces', serif; font-size: 28px; color: #C9A96E; }
    .stat__label { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: rgba(245,239,230,0.4); }
  </style>
</head>
<body>
  <h1>Phase 1 <em>Test Dashboard</em></h1>
  <p class="subtitle">Product data model + Cart infrastructure verification</p>

  <div class="stats">
    <div class="stat">
      <div class="stat__num" id="stat-products">0</div>
      <div class="stat__label">Products</div>
    </div>
    <div class="stat">
      <div class="stat__num" id="stat-categories">0</div>
      <div class="stat__label">Categories</div>
    </div>
    <div class="stat">
      <div class="stat__num" id="stat-featured">0</div>
      <div class="stat__label">Featured</div>
    </div>
    <div class="stat">
      <div class="stat__num" id="stat-cart">0</div>
      <div class="stat__label">In Cart</div>
    </div>
  </div>

  <h2>All Products</h2>
  <div class="test-grid" id="product-grid"></div>

  <h2>Shopping Cart</h2>
  <div class="cart-panel" id="cart-panel">
    <div class="cart-panel__empty">Cart is empty</div>
  </div>

  <script src="../js/products-data.js"></script>
  <script src="../js/cart.js"></script>
  <script>
    // ── Stats ──
    document.getElementById('stat-products').textContent = getAllProducts().length;
    document.getElementById('stat-categories').textContent = getActiveCategories().length;
    document.getElementById('stat-featured').textContent = getFeaturedProducts().length;

    function updateCartStat() {
      document.getElementById('stat-cart').textContent = getCartCount();
    }

    // ── Render Products ──
    const grid = document.getElementById('product-grid');
    const products = getAllProducts();

    function badgeClass(badge) {
      if (!badge) return '';
      const b = badge.toLowerCase();
      if (b === 'sale') return 'test-card__badge--sale';
      if (b === 'new') return 'test-card__badge--new';
      if (b.includes('best')) return 'test-card__badge--best';
      if (b.includes('value')) return 'test-card__badge--value';
      return 'test-card__badge--best';
    }

    products.forEach(p => {
      const cat = PRODUCT_CATEGORIES.find(c => c.slug === p.category);
      const card = document.createElement('div');
      card.className = 'test-card';
      card.innerHTML = `
        <div class="test-card__img">
          <img src="${p.image}" alt="${p.name}" onerror="this.parentElement.innerHTML='${cat ? cat.icon : '📦'}';" />
        </div>
        <div class="test-card__body">
          ${p.badge ? `<span class="test-card__badge ${badgeClass(p.badge)}">${p.badge}</span>` : ''}
          <div class="test-card__cat">${cat ? cat.label : p.category}</div>
          <div class="test-card__name">${p.name}</div>
          <div class="test-card__price">
            ${formatPrice(p.price)}
            ${p.oldPrice ? `<span class="old">${formatPrice(p.oldPrice)}</span>` : ''}
          </div>
          <button class="test-add-btn" data-id="${p.id}">Add to Cart</button>
        </div>
      `;
      grid.appendChild(card);
    });

    // ── Add to Cart handlers ──
    grid.addEventListener('click', e => {
      const btn = e.target.closest('.test-add-btn');
      if (!btn) return;
      const product = getProductById(btn.dataset.id);
      if (!product) return;

      // If product has variants, add first variant
      const variant = product.variants ? product.variants[0] : null;
      addToCart(product, 1, variant);
      showCartToast(`${product.name} added!`);
      renderCart();
    });

    // ── Render Cart ──
    function renderCart() {
      const panel = document.getElementById('cart-panel');
      const cart = getCart();
      updateCartStat();

      if (!cart.length) {
        panel.innerHTML = '<div class="cart-panel__empty">Cart is empty</div>';
        return;
      }

      let html = cart.map(item => `
        <div class="cart-item-row">
          <div>
            <div class="cart-item-row__name">${item.name}</div>
            ${item.variant ? `<div class="cart-item-row__variant">${item.variant}</div>` : ''}
          </div>
          <div class="cart-item-row__meta">
            <div class="cart-item-row__qty">x${item.quantity}</div>
            <div class="cart-item-row__price">${formatPrice(item.price * item.quantity)}</div>
          </div>
          <button class="cart-item-row__remove" data-cart-id="${item.cartItemId}">&times;</button>
        </div>
      `).join('');

      html += `
        <div class="cart-total">
          <span class="cart-total__label">Subtotal</span>
          <span class="cart-total__value">${formatPrice(getCartTotal())}</span>
        </div>
      `;

      html += `<button class="clear-btn" id="clear-cart-btn">Clear Cart</button>`;

      panel.innerHTML = html;

      // Remove handlers
      panel.querySelectorAll('.cart-item-row__remove').forEach(btn => {
        btn.addEventListener('click', () => {
          removeFromCart(btn.dataset.cartId);
          renderCart();
          showCartToast('Item removed', 'info');
        });
      });

      // Clear handler
      document.getElementById('clear-cart-btn').addEventListener('click', () => {
        clearCart();
        renderCart();
        showCartToast('Cart cleared', 'info');
      });
    }

    // Initial render
    renderCart();
    updateCartStat();

    // Listen for external cart updates
    window.addEventListener('velour:cart-updated', () => {
      renderCart();
      updateCartStat();
    });
  </script>
</body>
</html>
